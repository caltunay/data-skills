name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build one ZIP per skill
        run: scripts/package-zips

      - name: Upload every ZIP as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
